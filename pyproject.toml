[project]
name = "dock-timelapse"
version = "0.2.0"
description = "Record your macOS Dock over time and render Apple-style timelapse videos of its evolution (CLI + MCP server)."
readme = "README.md"
authors = [
    { name = "David Boclé", email = "bcldvd@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["macos", "dock", "timelapse", "video", "mcp", "agent-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "mcp>=2.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
]

[project.urls]
Homepage = "https://github.com/bcldvd/dock-timelapse"
Repository = "https://github.com/bcldvd/dock-timelapse"
Issues = "https://github.com/bcldvd/dock-timelapse/issues"

[project.scripts]
dock-timelapse = "dock_timelapse:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
