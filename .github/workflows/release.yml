name: release
# Push a tag like v0.2.0: publishes to PyPI (trusted publishing) then to the official MCP Registry.
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do curl -sf "https://pypi.org/pypi/dock-timelapse/$v/json" >/dev/null && exit 0; sleep 10; done
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
