name: mac-release
# Push a tag like v0.4.0: builds the universal app, signs it with Developer ID, notarizes the DMG and
# attaches it to the GitHub release.
#
# Secrets:
#   DEVELOPER_ID_P12        base64 of the "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_P12_PASSWORD
#   NOTARY_KEY_P8           base64 of an App Store Connect API key (.p8) with Developer access
#   NOTARY_KEY_ID, NOTARY_ISSUER
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: swift test
        working-directory: mac
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign, notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$VERSION" == "$GITHUB_REF_NAME" ]] && VERSION=0.0.0-dev
          export VERSION ARCHS="arm64 x86_64"
          export SIGN="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          mac/scripts/build-app.sh
          mac/scripts/make-dmg.sh
          spctl --assess --type open --context context:primary-signature -v mac/build/Dock-Timelapse-$VERSION.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mac/build/Dock-Timelapse-*.dmg --clobber || gh release create "$GITHUB_REF_NAME" mac/build/Dock-Timelapse-*.dmg --generate-notes
